<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cola Use Cases</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --bg-card-hover: #222222;
            --brand: #f1752d;
            --brand-glow: rgba(241, 117, 45, 0.15);
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border: #2a2a2a;
            --border-hover: #3a3a3a;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Banner */
        .top-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .banner-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .banner-logo .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--brand);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .banner-logo h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .banner-stats {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .banner-stats .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .banner-stats .stat-number {
            color: var(--brand);
            font-weight: 600;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px 8px 36px;
            color: var(--text-primary);
            font-size: 14px;
            width: 240px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-glow);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Layout */
        .layout {
            display: flex;
            margin-top: 64px;
            min-height: calc(100vh - 64px);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 64px;
            left: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 64px);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            overflow-y: auto;
            z-index: 50;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding: 0 12px;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .category-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-item:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .category-item.active {
            background: var(--brand-glow);
            color: var(--brand);
        }

        .category-item .cat-icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
        }

        .category-item .cat-count {
            margin-left: auto;
            font-size: 12px;
            background: var(--bg-primary);
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--text-muted);
        }

        .category-item.active .cat-count {
            background: rgba(241, 117, 45, 0.2);
            color: var(--brand);
        }

        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 32px;
        }

        .content-header {
            margin-bottom: 28px;
        }

        .content-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .content-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--brand);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px var(--border-hover);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--brand);
            background: var(--brand-glow);
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 14px;
            width: fit-content;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .card-prompt {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-primary);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }

        .card-prompt .prompt-label {
            color: var(--brand);
            margin-right: 4px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .card-user {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .card-user .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brand), #ff9a5c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: white;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 900px) {
            .sidebar {
                display: none;
            }
            .main-content {
                margin-left: 0;
            }
            .mobile-filter {
                display: flex !important;
            }
        }

        @media (max-width: 640px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .top-banner {
                padding: 0 16px;
            }
            .banner-stats {
                display: none;
            }
            .search-input {
                width: 160px;
            }
            .main-content {
                padding: 20px 16px;
            }
        }

        /* Mobile Filter Bar */
        .mobile-filter {
            display: none;
            gap: 8px;
            padding: 16px 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .mobile-filter::-webkit-scrollbar {
            display: none;
        }

        .mobile-filter-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .mobile-filter-btn.active {
            background: var(--brand-glow);
            color: var(--brand);
            border-color: var(--brand);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }

        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.3s; }
        .card:nth-child(7) { animation-delay: 0.35s; }
        .card:nth-child(8) { animation-delay: 0.4s; }
        .card:nth-child(9) { animation-delay: 0.45s; }
        .card:nth-child(10) { animation-delay: 0.5s; }
        .card:nth-child(11) { animation-delay: 0.55s; }
        .card:nth-child(12) { animation-delay: 0.6s; }
        .card:nth-child(13) { animation-delay: 0.65s; }
        .card:nth-child(14) { animation-delay: 0.7s; }
        .card:nth-child(15) { animation-delay: 0.75s; }
        .card:nth-child(16) { animation-delay: 0.8s; }
        .card:nth-child(17) { animation-delay: 0.85s; }
        .card:nth-child(18) { animation-delay: 0.9s; }
        .card:nth-child(19) { animation-delay: 0.95s; }
        .card:nth-child(20) { animation-delay: 1.0s; }
        .card:nth-child(21) { animation-delay: 1.05s; }

        .card.hidden {
            display: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .no-results .emoji {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Top Banner -->
    <header class="top-banner">
        <div class="banner-logo">
            <div class="logo-icon">C</div>
            <h1>Cola Use Cases</h1>

        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="搜索案例..." id="searchInput">
        </div>

    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-title">分类</div>

                <li class="category-item" data-category="efficiency">
                    <span class="cat-icon">⚡</span>
                    <span>效率</span>

                </li>
                <li class="category-item" data-category="creation">
                    <span class="cat-icon">🎬</span>

                    <span class="cat-count">5</span>

                <li class="category-item" data-category="companion">
                    <span class="cat-icon">💛</span>

                    <span class="cat-icon">🎵</span>

        <!-- Main Content -->
        <main class="main-content">

            <div class="mobile-filter">

            <div class="content-header">

            </div>

            <div class="cards-grid" id="cardsGrid">
                <!-- Cards injected by JS -->
            </div>
        </main>
    </div>

                category: "life",
                categoryLabel: "🎵 生活",
                user: "Loki",
                prompt: "放首歌"
            },
            {
                title: "照片共享平台",
                desc: "黑客松的摄影师用Cola搓了个照片共享平台，直接上线。",
                category: "life",
                categoryLabel: "🎵 生活",
                user: "用户",
                prompt: "帮我搭一个照片共享网站，大家可以上传下载"
            }
        ];

        const categoryDescriptions = {
            all: "探索 Cola 在效率、创作、陪伴和生活中的真实使用场景",
            efficiency: "省掉重复劳动，把时间还给重要的事",
            creation: "从分镜到成片、从灵感到歌词",
            companion: "记得你说过的话，理解你没说出口的意思",
            life: "让 Cola 融入日常"
        };

        const categoryTitles = {
            all: "全部案例",
            efficiency: "⚡ 效率",
            creation: "🎬 创作",
            companion: "💛 陪伴",
            life: "🎵 生活"
        };

        let currentCategory = 'all';
        let searchQuery = '';

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const filtered = cases.filter(c => {
                const matchCategory = currentCategory === 'all' || c.category === currentCategory;
                const matchSearch = searchQuery === '' || 
                    c.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    c.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    c.user.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results"><span class="emoji">🔍</span>没有找到匹配的案例</div>';
                return;
            }

            grid.innerHTML = filtered.map((c, i) => `
                <div class="card" style="animation-delay: ${i * 0.05}s">
                    <div class="card-category">${c.categoryLabel}</div>
                    <div class="card-title">${c.title}</div>
                    <div class="card-desc">${c.desc}</div>
                    <div class="card-prompt">
                        <span class="prompt-label">👉 试试看:</span>${c.prompt}
                    </div>
                    <div class="card-footer">
                        <div class="card-user">
                            <div class="avatar">${c.user[0]}</div>
                            <span>${c.user}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function setCategory(category) {
            currentCategory = category;
            
            // Update sidebar
            document.querySelectorAll('.category-item').forEach(el => {
                el.classList.toggle('active', el.dataset.category === category);
            });

            // Update mobile filter
            document.querySelectorAll('.mobile-filter-btn').forEach(el => {
                el.classList.toggle('active', el.dataset.category === category);
            });

            // Update header
            document.getElementById('contentTitle').textContent = categoryTitles[category];
            document.getElementById('contentDesc').textContent = categoryDescriptions[category];

            renderCards();
        }

        // Event listeners
        document.querySelectorAll('.category-item').forEach(el => {
            el.addEventListener('click', () => setCategory(el.dataset.category));
        });

        document.querySelectorAll('.mobile-filter-btn').forEach(el => {
            el.addEventListener('click', () => setCategory(el.dataset.category));
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderCards();
        });

        // Initial render
        renderCards();
    </script>
</body>
</html>
